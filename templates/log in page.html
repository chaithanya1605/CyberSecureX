<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CyberSecureX</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .password-field-container {
            position: relative;
            width: 100%;
        }
        .password-field-container input {
            padding-right: 40px;
        }
        .toggle-password-icon {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 16px;
            user-select: none;
            opacity: 0.7;
        }
        .toggle-password-icon:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>CyberSecureX</h1>
        <h2>Login page</h2>
        {% if error %}<p style="color:#ff4d4d; font-weight:bold;">{{ error }}</p>{% endif %}
        <form action="/login" method="post">
            <label for="username">User name</label>
            <input type="text" id="username" name="username" placeholder="user name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="enter your Email" required>

            <label for="password">Password</label>
            <div class="password-field-container">
                <input type="password" id="password" name="password" placeholder="Enter password" required>
                <span class="toggle-password-icon" onclick="togglePasswordVisibility('password', this)">👁</span>
            </div>

            <button type="submit">Login</button>
        </form>
        <p>New to the website? <a href="/register">Register</a></p>
    </div>

    <script>
        function togglePasswordVisibility(inputId, icon) {
            const field = document.getElementById(inputId);
            if (field.type === "password") {
                field.type = "text";
                icon.textContent = "🙈";
            } else {
                field.type = "password";
                icon.textContent = "👁️";
            }
        }
    </script>
</body>
</html>
